name: Build artifacts

# The installer and release packages (ADR-008), by tools/packaging/New-Release.ps1: a self-contained publish packed by
# Velopack. Unsigned: no certificate yet, so Windows SmartScreen warns on the installer's first run.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (e.g. 0.1.0, without the leading v)
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    outputs:
      artifact-name:
        description: Name of the uploaded artifact
        value: noto-windows

permissions:
  contents: read

jobs:
  package:
    name: Package (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build the installer
        shell: pwsh
        run: tools/packaging/New-Release.ps1 -Version '${{ inputs.version }}'

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: noto-windows
          path: ./artifacts/release
          if-no-files-found: error
          retention-days: 14
