name: Release

# Releases are deliberately manual. Tagging does not publish on its own —
# the release process must be understood and verified before it is automated.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.1.0, without the leading v)
        required: true
        type: string
      prerelease:
        description: Mark as a pre-release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check semantic version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${{ inputs.version }}' is not a valid semantic version."
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ inputs.version }} already exists."
            exit 1
          fi

      - name: Check CHANGELOG has an entry
        run: |
          if ! grep -q "## \[${{ inputs.version }}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${{ inputs.version }}]' section."
            exit 1
          fi

  build:
    name: Build
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      configuration: Release

  release:
    name: Create release
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: noto-windows
          path: ./artifacts
        continue-on-error: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Draft, never auto-published. A human reviews and publishes it.
          gh release create "v${{ inputs.version }}" \
            --title "Noto v${{ inputs.version }}" \
            --notes-file <(awk "/## \[${{ inputs.version }}\]/{f=1;next}/^## \[/{f=0}f" CHANGELOG.md) \
            --draft \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            --target "${{ github.sha }}"
