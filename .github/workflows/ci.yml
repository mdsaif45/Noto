name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Noto.sln

      - name: Verify formatting
        run: dotnet format Noto.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Noto.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test Noto.sln
          --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./artifacts/test-results
          if-no-files-found: ignore

  docs:
    name: Validate docs & governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate issue forms and workflows are valid YAML
        shell: bash
        run: |
          python3 - <<'PY'
          import sys, pathlib, yaml
          bad = []
          for p in list(pathlib.Path('.github').rglob('*.yml')) + list(pathlib.Path('.github').rglob('*.yaml')):
              try:
                  yaml.safe_load(p.read_text(encoding='utf-8'))
              except Exception as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print("::error::Invalid YAML:")
              for b in bad: print("  " + b)
              sys.exit(1)
          print("All .github YAML files parse cleanly.")
          PY

      - name: Check required governance files exist
        shell: bash
        run: |
          missing=0
          for f in README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md LICENSE \
                   .github/CODEOWNERS .github/dependabot.yml .github/pull_request_template.md; do
            if [ ! -f "$f" ]; then echo "::error::Missing $f"; missing=1; fi
          done
          exit $missing

      - name: Check ADRs are indexed
        shell: bash
        run: |
          shopt -s nullglob
          fail=0
          for adr in docs/decisions/ADR-*.md; do
            base=$(basename "$adr")
            if ! grep -q "$base" docs/decisions/README.md 2>/dev/null; then
              echo "::error::$base is not listed in docs/decisions/README.md"
              fail=1
            fi
          done
          exit $fail
