name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Detect solution
        id: detect
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Path . -Filter *.sln -Recurse -File -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          "found=$(if ($sln) { 'true' } else { 'false' })" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Initialize CodeQL
        if: steps.detect.outputs.found == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-and-quality

      - name: Autobuild
        if: steps.detect.outputs.found == 'true'
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        if: steps.detect.outputs.found == 'true'
        uses: github/codeql-action/analyze@v3
