name: 🔧 Improvement
description: Improve something that already exists — UX, performance, or polish.
title: "[Improvement]: "
labels: ["type:task", "needs-triage"]
body:
  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: What does Noto do today?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Why is this worth improving?
      description: What friction, cost or confusion does the current behavior cause?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind of improvement
      options:
        - User experience
        - Performance or resource usage
        - Accessibility
        - Visual polish
        - Developer experience
        - Documentation
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
